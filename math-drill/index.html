<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>中学数学 図解ドリル</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@700;900&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 左に出題設定パネル、右に方眼紙風の演習プリント。カードは幅に応じて1〜2列 */
:root{
  --bg:#e9eef3; --paper:#ffffff; --ink:#1c2836; --muted:#5a6878; --line:#cdd6e0;
  --grid:#e1e8f0; --grid2:#bccada; --accent:#22508c; --accent-ink:#ffffff; --pen:#c8322b;
  --water:#d3e8f6; --tape:#f6efcf; --metal:#7c8794; --face1:#dfe7f0; --face2:#f1f5f9; --face3:#c6d3e1;
  --num:#2c6cb8; --func:#c2601a; --geo:#33843a; --data:#76569c;
  --f-display:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161c; --paper:#192029; --ink:#e2e8ee; --muted:#98a5b3; --line:#2d3743;
  --grid:#232d38; --grid2:#3a4757; --accent:#7fb0ef; --accent-ink:#0d1520; --pen:#ff7b70;
  --water:#1b3a54; --tape:#3d3826; --metal:#8b96a3; --face1:#2a3542; --face2:#33404f; --face3:#212a35;
  --num:#6ea8ec; --func:#ec9a5c; --geo:#78c47c; --data:#b496db; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161c; --paper:#192029; --ink:#e2e8ee; --muted:#98a5b3; --line:#2d3743;
  --grid:#232d38; --grid2:#3a4757; --accent:#7fb0ef; --accent-ink:#0d1520; --pen:#ff7b70;
  --water:#1b3a54; --tape:#3d3826; --metal:#8b96a3; --face1:#2a3542; --face2:#33404f; --face3:#212a35;
  --num:#6ea8ec; --func:#ec9a5c; --geo:#78c47c; --data:#b496db; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.app{display:grid;grid-template-columns:290px minmax(0,1fr);gap:24px;max-width:1360px;margin:0 auto;align-items:start}
@media (max-width:900px){.app{grid-template-columns:minmax(0,1fr)}}

/* panel */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:18px;position:sticky;top:max(16px,env(safe-area-inset-top,0px))}
@media (max-width:900px){.panel{position:static}}
.brand h1{font-family:var(--f-display);font-weight:900;font-size:22px;line-height:1.3;margin:0;letter-spacing:.02em}
.brand p{margin:4px 0 0;color:var(--muted);font-size:13px;line-height:1.6}
.panel h2{font-size:12px;letter-spacing:.12em;color:var(--muted);margin:0 0 8px;font-weight:700}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.quick button,.btn-sub{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:6px;padding:3px 10px;cursor:pointer}
.quick button:hover,.btn-sub:hover{border-color:var(--accent);color:var(--accent)}
fieldset{border:0;margin:0 0 8px;padding:0}
legend{font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px;padding:0;margin-bottom:2px}
legend::before{content:"";width:10px;height:10px;border-radius:2px;background:var(--fc)}
.unit-opt{display:flex;align-items:center;gap:8px;font-size:14px;padding:2px 0;cursor:pointer}
.unit-opt input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.unit-opt .gr{margin-left:auto;font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row label{font-size:13px;color:var(--muted)}
select,input[type=number]{font:inherit;font-size:14px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink)}
input[type=number]{width:120px;font-family:var(--f-mono)}
.btn-main{font:inherit;font-weight:700;font-size:15px;width:100%;padding:10px 12px;border-radius:8px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn-main:hover{filter:brightness(1.08)}
.switch{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.switch input{accent-color:var(--pen);width:16px;height:16px;margin:0}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{font-size:12px;color:var(--muted);margin:0;line-height:1.6}

/* sheet */
.sheet{min-width:0}
.sheet-head{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:end;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:18px}
.sheet-head h2{font-family:var(--f-display);font-weight:700;font-size:24px;margin:0;text-wrap:balance}
.sheet-meta{font-size:13px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap}
.sheet-meta b{font-family:var(--f-mono);color:var(--ink);font-weight:500}
.namebox{font-size:13px;color:var(--muted);display:none}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr));gap:18px;align-items:start}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px 18px 14px;min-width:0;display:grid;gap:10px}
.card-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.no{font-family:var(--f-display);font-weight:900;font-size:20px;line-height:1}
.chip{font-size:12px;font-weight:700;color:var(--fc);border:1.5px solid var(--fc);border-radius:4px;padding:0 6px;line-height:1.6}
.unit-name{font-weight:700;font-size:14px}
.grade{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.regen{margin-left:auto}
.lead{margin:0}
.figwrap{border:1px solid var(--line);border-radius:6px;padding:8px;overflow-x:auto;background:var(--paper)}
.fig{display:block;width:100%;max-width:440px;height:auto;margin:0 auto}
.qs,.as{margin:0;padding:0;list-style:none;counter-reset:q;display:grid;gap:6px}
.qs li,.as li{counter-increment:q;padding-left:2.4em;position:relative}
.qs li::before,.as li::before{content:"(" counter(q) ")";position:absolute;left:0;font-family:var(--f-mono);font-size:13px;top:.15em;color:var(--muted)}
.ans{border-top:1px dashed var(--line);padding-top:8px}
.ans summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--pen);list-style:none;display:inline-flex;align-items:center;gap:6px}
.ans summary::-webkit-details-marker{display:none}
.ans summary::before{content:"▶";font-size:10px;transition:transform .15s}
.ans[open] summary::before{transform:rotate(90deg)}
.ans-body{display:grid;gap:10px;margin-top:8px}
.as .a{color:var(--pen);font-weight:700}
.as .ex{display:block;color:var(--muted);font-size:13.5px;line-height:1.7}
.note{font-size:13px;color:var(--muted)}
table.mini{border-collapse:collapse;font-size:13px;margin:2px 0}
table.mini th,table.mini td{border:1px solid var(--line);padding:2px 8px;text-align:center;font-variant-numeric:tabular-nums}
table.mini th{font-weight:700;background:var(--face2)}
.tblwrap{overflow-x:auto}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.88em;line-height:1.2;margin:0 .15em}
.fr>span:first-child{border-bottom:1px solid currentColor;padding:0 .25em}
.mono{font-family:var(--f-mono);font-size:14px;letter-spacing:.02em}
.empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* SVG figure classes */
.fig text{font-family:var(--f-body);fill:var(--ink);font-size:12px}
.fig .tm{fill:var(--muted);font-size:10.5px}
.fig .tp{fill:var(--pen);font-weight:700}
.fig .tb{font-weight:700;font-size:13px}
.s{stroke:var(--ink);stroke-width:1.6;fill:none}
.sf{stroke:var(--ink);stroke-width:1.6;fill:var(--paper)}
.th{stroke:var(--ink);stroke-width:1;fill:none}
.bold{stroke:var(--ink);stroke-width:4;fill:none}
.g{stroke:var(--grid);stroke-width:.7;fill:none}
.g2{stroke:var(--grid2);stroke-width:.9;fill:none}
.dash{stroke-dasharray:4 3}
.ray{stroke:var(--accent);stroke-width:1.5;fill:none}
.pen{stroke:var(--pen);stroke-width:2;fill:none}
.water{fill:var(--water);stroke:none}
.fi{fill:var(--ink);stroke:none}
.fp{fill:var(--pen);stroke:none}
.fa{fill:var(--accent);stroke:none}
.tape{fill:var(--tape);stroke:var(--ink);stroke-width:1}
.metal{fill:var(--metal);stroke:var(--ink);stroke-width:1}
.f1{fill:var(--face1);stroke:var(--ink);stroke-width:1.4}
.f2{fill:var(--face2);stroke:var(--ink);stroke-width:1.4}
.f3{fill:var(--face3);stroke:var(--ink);stroke-width:1.4}
.lensf{fill:var(--water);stroke:var(--ink);stroke-width:1.4}
.c-k{stroke:var(--func);stroke-width:2.2;fill:none}
.c-n{stroke:var(--num);stroke-width:2.2;fill:none}

@media print{
  body{background:#fff;color:#000;padding:0}
  .panel,.regen{display:none!important}
  .app{display:block}
  .namebox{display:block}
  .card{break-inside:avoid;border-color:#999}
  .cards{grid-template-columns:1fr 1fr;gap:10px}
  body:not(.print-ans) .ans{display:none}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink)"/></marker>
    <marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--pen)"/></marker>
    <marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--accent)"/></marker>
  </defs>
</svg>

<div class="app">
  <aside class="panel" aria-label="出題設定">
    <div class="brand">
      <h1>中学数学 図解ドリル</h1>
      <p>単元を選ぶと、図つきの演習問題を数値を変えて何度でも作れます。</p>
    </div>
    <section>
      <h2>出題する単元</h2>
      <div class="quick">
        <button type="button" data-grade="1">中1</button>
        <button type="button" data-grade="2">中2</button>
        <button type="button" data-grade="3">中3</button>
        <button type="button" data-sel="all">すべて</button>
        <button type="button" data-sel="none">解除</button>
      </div>
      <div id="unit-list"></div>
    </section>
    <section style="display:grid;gap:10px">
      <h2>プリント</h2>
      <div class="row">
        <label for="count">問題数</label>
        <select id="count">
          <option>2</option><option>4</option><option selected>6</option><option>8</option><option>10</option><option>12</option><option>16</option><option>20</option>
        </select>
      </div>
      <button type="button" class="btn-main" id="gen">新しいプリントを作る</button>
      <div class="row">
        <label for="seed">シード</label>
        <input type="number" id="seed" min="1" max="999999" inputmode="numeric">
        <button type="button" class="btn-sub" id="apply">再現</button>
      </div>
      <p class="hint">同じシードと単元・問題数なら、同じプリントをもう一度作れます。</p>
      <label class="switch"><input type="checkbox" id="showans"> 解答・解説をすべて開く</label>
      <button type="button" class="btn-sub" id="print" hidden>印刷する</button>
    </section>
  </aside>

  <main class="sheet">
    <div class="sheet-head">
      <h2 id="sheet-title">数学 演習プリント</h2>
      <div class="sheet-meta">
        <span>シード <b id="m-seed">-</b></span>
        <span><b id="m-count">-</b> 問</span>
        <span class="namebox">年　　組　　番　名前＿＿＿＿＿＿＿＿＿＿</span>
      </div>
    </div>
    <div class="cards" id="cards"></div>
  </main>
</div>

<script>
/* ---------- 乱数・書式 ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let rnd=Math.random;
let clipN=0;
const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));
const pick=a=>a[Math.floor(rnd()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function f(x,d=2){const v=Math.round(x*10**d)/10**d;return String(Object.is(v,-0)?0:v)}
const f1=x=>{const v=Math.round(x*10)/10;return v.toFixed(1)}; // 小数第1位まで必ず表示
const n=x=>Math.round(x*10)/10;

/* ---------- SVG 部品 ---------- */
const L=(x1,y1,x2,y2,c='s',ex='')=>`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}" class="${c}" ${ex}/>`;
const Rc=(x,y,w,h,c='s',ex='')=>`<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" class="${c}" ${ex}/>`;
const C=(cx,cy,r,c='s')=>`<circle cx="${n(cx)}" cy="${n(cy)}" r="${r}" class="${c}"/>`;
const T=(x,y,s,o={})=>`<text x="${n(x)}" y="${n(y)}" text-anchor="${o.a||'middle'}"${o.c?` class="${o.c}"`:''}${o.size?` style="font-size:${o.size}px"`:''}>${s}</text>`;
const P=(d,c='s',ex='')=>`<path d="${d}" class="${c}" ${ex}/>`;
const svg=(w,h,body,label)=>`<svg viewBox="0 0 ${w} ${h}" class="fig" role="img" aria-label="${label}">${body}</svg>`;
function smooth(pts){
  pts=pts.map(p=>[n(p[0]),n(p[1])]);
  let d=`M${pts[0][0]},${pts[0][1]}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    const c1=[n(p1[0]+(p2[0]-p0[0])/6),n(p1[1]+(p2[1]-p0[1])/6)],c2=[n(p2[0]-(p3[0]-p1[0])/6),n(p2[1]-(p3[1]-p1[1])/6)];
    d+=` C${c1} ${c2} ${p2}`;
  }
  return d;
}
/* 方眼グラフ */
function graph(o){
  const xmin=o.xmin||0,ymin=o.ymin||0;
  const X=v=>o.x+(v-xmin)/(o.xmax-xmin)*o.w, Y=v=>o.y+o.h-(v-ymin)/(o.ymax-ymin)*o.h;
  let s='';const eps=1e-9;
  if(o.xm)for(let v=xmin;v<=o.xmax+eps;v+=o.xm)s+=L(X(v),o.y,X(v),o.y+o.h,'g');
  if(o.ym)for(let v=ymin;v<=o.ymax+eps;v+=o.ym)s+=L(o.x,Y(v),o.x+o.w,Y(v),'g');
  for(let v=xmin;v<=o.xmax+eps;v+=o.xs){s+=L(X(v),o.y,X(v),o.y+o.h,'g2');s+=T(X(v),o.y+o.h+14,f(v,2),{c:'tm'})}
  for(let v=ymin;v<=o.ymax+eps;v+=o.ys){s+=L(o.x,Y(v),o.x+o.w,Y(v),'g2');s+=T(o.x-5,Y(v)+4,f(v,2),{c:'tm',a:'end'})}
  s+=L(o.x,o.y+o.h,o.x+o.w,o.y+o.h)+L(o.x,o.y,o.x,o.y+o.h);
  s+=T(o.x+o.w/2,o.y+o.h+30,o.xl);
  s+=T(o.x-4,o.y-8,o.yl,{a:'start'});
  return {s,X,Y};
}
/* ---------- 問題生成 ---------- */
/* 数の表示 */
const MI='−';
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a};
const sg=x=>x<0?MI+f(-x,3):f(x,3);
function rat(nu,de=1){if(de<0){nu=-nu;de=-de}const g=gcd(nu,de)||1;return{nu:nu/g,de:de/g}}
const frBox=(a,b)=>`<span class="fr"><span>${a}</span><span>${b}</span></span>`;
function fr(nu,de=1){const r=rat(nu,de);if(r.de===1)return sg(r.nu);return(r.nu<0?MI:'')+frBox(Math.abs(r.nu),r.de)}
function frT(nu,de=1){const r=rat(nu,de);return r.de===1?sg(r.nu):(r.nu<0?MI:'')+Math.abs(r.nu)+'/'+r.de}
function sqrtSimp(v){let a=1,b=v;for(let k=2;k*k<=b;k++)while(b%(k*k)===0){b/=k*k;a*=k}return[a,b]}
function rt(v){const[a,b]=sqrtSimp(v);return b===1?String(a):(a===1?'':a)+'√'+b}
/* 係数(分数)×√rad の表示。rad=1なら有理数 */
function frRt(nu,de,rad=1){
  const[a,b]=sqrtSimp(rad);const r=rat(nu*a,de);const tail=b===1?'':'√'+b;
  if(r.de===1)return(r.nu<0?MI:'')+(Math.abs(r.nu)===1&&tail?'':Math.abs(r.nu))+tail;
  return(r.nu<0?MI:'')+frBox((Math.abs(r.nu)===1&&tail?'':Math.abs(r.nu))+tail,r.de);
}
/* 係数×π */
function piS(nu,de=1){const r=rat(nu,de);if(r.de===1)return(r.nu===1?'':r.nu)+'π';return frBox(r.nu,r.de)+'π'}
/* 多項式 terms:[[nu,de,'x²'],...] */
function poly(terms){
  let s='';terms.forEach(([nu,de,v])=>{const r=rat(nu,de);if(r.nu===0)return;const neg=r.nu<0,ab=Math.abs(r.nu);
    const c=r.de===1?(ab===1&&v?'':String(ab)):frBox(ab,r.de);s+=s?(neg?' − ':' + '):(neg?MI:'');s+=c+v});
  return s||'0';
}
const lineEq=(mn,md,c,cd=1)=>'y = '+poly([[mn,md,'x'],[c,cd,'']]);
const pt2=(x,y)=>`(${x}, ${y})`;

/* 幾何の補助 */
const D2R=Math.PI/180;
const onC=(cx,cy,r,deg)=>[cx+r*Math.cos(deg*D2R),cy-r*Math.sin(deg*D2R)];
const angOf=(V,P)=>Math.atan2(-(P[1]-V[1]),P[0]-V[0])/D2R;
function arcPath(cx,cy,r,a1,a2){const p1=onC(cx,cy,r,a1),p2=onC(cx,cy,r,a2),d=((a2-a1)%360+360)%360;
  return`M${n(p1[0])},${n(p1[1])} A${r},${r} 0 ${d>180?1:0} 0 ${n(p2[0])},${n(p2[1])}`}
/* Vにおける角P1VP2(180°未満側)に弧とラベル */
function angMark(V,P1,P2,r,label,cls='th',lc='tb'){
  let a1=angOf(V,P1),a2=angOf(V,P2);if(((a2-a1)%360+360)%360>180)[a1,a2]=[a2,a1];
  const d=((a2-a1)%360+360)%360,mid=a1+d/2,lp=onC(V[0],V[1],r+11,mid);
  return P(arcPath(V[0],V[1],r,a1,a2),cls)+(label?T(lp[0],lp[1]+4,label,{c:lc}):'');
}
function rightMark(V,P1,P2,s=9){
  const u=(P)=>{const dx=P[0]-V[0],dy=P[1]-V[1],l=Math.hypot(dx,dy);return[dx/l*s,dy/l*s]};
  const a=u(P1),b=u(P2);return P(`M${n(V[0]+a[0])},${n(V[1]+a[1])} L${n(V[0]+a[0]+b[0])},${n(V[1]+a[1]+b[1])} L${n(V[0]+b[0])},${n(V[1]+b[1])}`,'th');
}
function tickMark(A,B,k=1){

  return `<article class="card" style="--fc:var(--${c.u.field})">
    <div class="card-h"><span class="no">${i+1}</span><span class="chip">${FIELDS[c.u.field]}</span><span class="unit-name">${c.u.name}</span><span class="grade">中${c.u.grade}</span>
      <button type="button" class="btn-sub regen" data-i="${i}">数値を変える</button></div>
    <p class="lead">${p.lead}</p>
    ${p.fig?`<div class="figwrap">${p.fig}</div>`:''}
    ${p.extra||''}
    <ol class="qs">${p.qs.map(q=>`<li>${q.q}</li>`).join('')}</ol>
    <details class="ans"${ansOpen}><summary>解答・解説</summary><div class="ans-body">
      ${p.ansFig?`<div class="figwrap">${p.ansFig}</div>`:''}
      <ol class="as">${p.qs.map(q=>`<li><span class="a">${q.a}</span><span class="ex">${q.ex}</span></li>`).join('')}</ol>
    </div></details>
  </article>`;
}
function renderCards(){
  $('#m-seed').textContent=state.seed;$('#m-count').textContent=state.cards.length;
  if(!state.cards.length){$('#cards').innerHTML='<div class="empty">出題する単元を1つ以上選んでください。</div>';return}
  const fs=[...new Set(state.cards.map(c=>FIELDS[c.u.field]))];
  $('#sheet-title').textContent=`数学 演習プリント（${fs.join('・')}）`;
  $('#cards').innerHTML=state.cards.map(cardHTML).join('');
}
function build(seed){
  state.seed=seed;$('#seed').value=seed;
  const units=UNITS.filter(u=>state.selected.has(u.id));
  rnd=mulberry32(seed);
  let order=[];while(units.length&&order.length<state.count)order=order.concat(shuffle(units));
  state.cards=order.slice(0,state.count).map(u=>({u,s:Math.floor(rnd()*2147483647)}));
  rnd=Math.random;
  renderCards();
}
const newSeed=()=>1+Math.floor(Math.random()*999999);

renderUnitList();
$('#count').value=String(state.count);
$('#unit-list').addEventListener('change',syncSel);
document.querySelectorAll('.quick button').forEach(b=>b.addEventListener('click',()=>{
  const g=b.dataset.grade,s=b.dataset.sel;
  document.querySelectorAll('#unit-list input').forEach(i=>{const u=UNITS.find(x=>x.id===i.value);i.checked=s==='all'?true:s==='none'?false:u.grade===+g});
  syncSel();
}));
$('#count').addEventListener('change',e=>{state.count=+e.target.value;store.set('m-count',state.count)});
$('#gen').addEventListener('click',()=>build(newSeed()));
$('#apply').addEventListener('click',()=>{const v=parseInt($('#seed').value,10);if(v>0)build(v)});
$('#seed').addEventListener('keydown',e=>{if(e.key==='Enter')$('#apply').click()});
$('#showans').addEventListener('change',e=>{document.querySelectorAll('.ans').forEach(d=>d.open=e.target.checked);document.body.classList.toggle('print-ans',e.target.checked)});
$('#cards').addEventListener('click',e=>{const b=e.target.closest('.regen');if(!b)return;const i=+b.dataset.i;state.cards[i].s=Math.floor(Math.random()*2147483647);
  const tmp=document.createElement('div');tmp.innerHTML=cardHTML(state.cards[i],i);b.closest('.card').replaceWith(tmp.firstElementChild)});
let inFrame=true;try{inFrame=window.self!==window.top}catch(e){}
if(!inFrame){$('#print').hidden=false;$('#print').addEventListener('click',()=>window.print())}
build(newSeed());
</script>
</body>
</html>
