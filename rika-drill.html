<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>中学理科ドリル工房</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Klee+One:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 方眼ノートの紙面。左に条件パネル（学年×分野のマトリクス）、右に問題カードの列。ダークは黒板。 */
:root{
  --paper:#f3f6fa; --sheet:#ffffff; --grid:#e3e9f2; --line:#cfd8e6;
  --ink:#15202f; --ink-2:#4b5a70; --accent:#15202f; --accent-ink:#ffffff;
  --hl:#ffe14d; --pen:#e0312b; --ok:#1f7a3d; --ng:#c0352b;
  --phys:#2f5fd0; --chem:#cf531b; --bio:#2e8540; --earth:#8a5a1c;
  --font-display:"Dela Gothic One","Zen Kaku Gothic New","Hiragino Sans",sans-serif;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  --font-q:"Klee One","Zen Kaku Gothic New","Hiragino Mincho ProN",serif;
  --font-mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#16231e; --sheet:#1d2e27; --grid:#21332b; --line:#35493f;
  --ink:#eef3ea; --ink-2:#a8bbaf; --accent:#eef3ea; --accent-ink:#16231e;
  --hl:rgba(255,224,102,.38); --pen:#ff7b72; --ok:#7fd48f; --ng:#ff8f87;
  --phys:#8fb4ff; --chem:#ffa36b; --bio:#7fd48f; --earth:#e0b872; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#16231e; --sheet:#1d2e27; --grid:#21332b; --line:#35493f;
  --ink:#eef3ea; --ink-2:#a8bbaf; --accent:#eef3ea; --accent-ink:#16231e;
  --hl:rgba(255,224,102,.38); --pen:#ff7b72; --ok:#7fd48f; --ng:#ff8f87;
  --phys:#8fb4ff; --chem:#ffa36b; --bio:#7fd48f; --earth:#e0b872; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background-color:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.7;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--phys);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{max-width:1220px;margin:0 auto;padding-block:24px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid;grid-template-columns:340px minmax(0,1fr);gap:28px;align-items:start}
.mast{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;
  padding-bottom:16px;border-bottom:2px solid var(--ink)}
.mast h1{font-family:var(--font-display);font-weight:400;font-size:clamp(26px,4.4vw,38px);line-height:1.15;margin:0;letter-spacing:.02em;text-wrap:balance}
.mast h1 small{display:block;font-family:var(--font-body);font-size:13px;font-weight:500;letter-spacing:.12em;color:var(--ink-2);margin-bottom:4px}
.mast p{margin:0;color:var(--ink-2);font-size:13.5px;max-width:34em}
.mast .stats{font-variant-numeric:tabular-nums}

/* ---------- 条件パネル ---------- */
.panel{background:var(--sheet);border:1.5px solid var(--line);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:20px;position:sticky;top:16px}
.grp{display:flex;flex-direction:column;gap:8px}
.grp-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lbl{font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--ink-2)}
.mini{display:flex;gap:10px}
.link{background:none;border:0;padding:0;color:var(--ink-2);font-size:12.5px;text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--ink)}

.matrix{display:grid;grid-template-columns:34px repeat(4,minmax(0,1fr));gap:4px}
.matrix .ch-col,.matrix .ch-row{background:none;border:0;padding:2px 0;font-size:12.5px;font-weight:700;color:var(--fc,var(--ink-2))}
.matrix .ch-row{text-align:left;color:var(--ink-2)}
.cell{--fc:var(--ink-2);min-height:62px;border:1.5px dashed var(--line);border-radius:4px;background:transparent;padding:5px 5px;
  font-size:11px;line-height:1.35;text-align:left;color:var(--ink-2);display:flex;flex-direction:column;justify-content:space-between;gap:2px;min-width:0;word-break:break-all}
.cell b{font-size:10.5px;font-weight:500;color:var(--ink-2);font-variant-numeric:tabular-nums}
.cell[aria-pressed="true"]{border-style:solid;border-color:var(--fc);color:var(--ink);background:color-mix(in srgb,var(--fc) 13%,var(--sheet))}
.cell[aria-pressed="true"] b{color:var(--fc)}
.f-phys{--fc:var(--phys)}.f-chem{--fc:var(--chem)}.f-bio{--fc:var(--bio)}.f-earth{--fc:var(--earth)}

.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--line);background:var(--sheet);border-radius:999px;padding:3px 14px;font-size:14px}
.seg button[aria-pressed="true"]{border-color:var(--ink);font-weight:700;background:linear-gradient(transparent 52%,var(--hl) 52%)}
.hint{font-size:12px;color:var(--ink-2);margin:0}

.btn{border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:10px 16px;font-weight:700;font-size:15px;letter-spacing:.04em;transition:transform .12s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.sm{padding:5px 12px;font-size:13.5px;border-radius:5px}
.big{width:100%;font-size:16px;padding:12px}

.code{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.code output,.code input{font-family:var(--font-mono);font-size:14px;letter-spacing:.06em;border:1.5px solid var(--line);border-radius:5px;padding:5px 8px;background:var(--paper);min-width:0;flex:1 1 140px}
.code input{background:var(--sheet)}

/* ---------- メイン ---------- */
main{min-width:0;display:flex;flex-direction:column;gap:16px}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;background:var(--sheet);border:1.5px solid var(--line);border-radius:6px;padding:10px 12px}
.tabs{display:flex;gap:4px}
.tabs button{border:0;background:none;padding:6px 14px;border-radius:5px;font-weight:700;color:var(--ink-2)}
.tabs button[aria-selected="true"]{color:var(--ink);background:linear-gradient(transparent 55%,var(--hl) 55%)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.score{display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums;font-size:14px}
.score strong{font-family:var(--font-display);font-weight:400;font-size:24px;color:var(--pen);line-height:1}
.meter{width:110px;height:8px;border-radius:4px;background:var(--grid);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.meter .m-ok{background:var(--ok)}.meter .m-ng{background:var(--ng)}
.note{margin:0;font-size:13px;color:var(--ink-2)}

.cards{display:flex;flex-direction:column;gap:14px}
.card{position:relative;background:var(--sheet);border:1.5px solid var(--line);border-radius:6px;padding:16px 18px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card-h{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding-right:56px}
.qno{font-family:var(--font-display);font-size:18px;line-height:1}
.tag{border:1.5px solid var(--fc);color:var(--fc);border-radius:3px;padding:0 6px;font-size:12px;font-weight:700;line-height:1.6}
.topic{font-size:13px;color:var(--ink-2)}
.kind{font-size:11px;letter-spacing:.12em;color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:0 8px}
.qt{font-family:var(--font-q);font-weight:600;font-size:17px;line-height:1.85;min-width:0}
.tw{overflow-x:auto;margin:8px 0 2px}
.dt{border-collapse:collapse;font-family:var(--font-body);font-weight:500;font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.dt th,.dt td{border:1px solid var(--ink-2);padding:3px 10px;text-align:center}
.dt th{font-weight:700;background:var(--paper)}

.ans{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.num{width:9.5em;max-width:100%;border:0;border-bottom:2px solid var(--ink);background:transparent;padding:3px 4px;font-size:18px;font-family:var(--font-q);font-weight:600;font-variant-numeric:tabular-nums}
.num:focus{outline:none;background:linear-gradient(transparent 60%,var(--hl) 60%)}
.unit{font-size:15px;margin-right:6px}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ch{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);border-radius:5px;background:var(--sheet);padding:8px 10px;font-size:14.5px;line-height:1.55;min-width:0}
.ch:hover:not(:disabled){border-color:var(--ink)}
.ch:disabled{cursor:default}
.kana{font-family:var(--font-q);font-weight:600;flex:none;width:1.4em;text-align:center}
.ch.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--sheet))}
.ch.wrong{border-color:var(--ng);background:color-mix(in srgb,var(--ng) 10%,var(--sheet));text-decoration:line-through;text-decoration-color:var(--ng)}

.fb{border-top:1.5px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.verdict{margin:0;font-weight:700}
.verdict.ok{color:var(--ok)}.verdict.ng{color:var(--ng)}.verdict.rv{color:var(--ink-2)}
.ex{font-size:14px;line-height:1.85;color:var(--ink)}
.ex b{color:var(--pen)}

.mark{position:absolute;top:8px;right:10px;width:62px;height:62px;pointer-events:none;overflow:visible}
.mark path{fill:none;stroke:var(--pen);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:0;animation:draw .45s ease-out both}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.mark path{animation:none}.btn{transition:none}}

.empty{background:var(--sheet);border:1.5px dashed var(--line);border-radius:6px;padding:28px;text-align:center;color:var(--ink-2)}

/* ---------- プリント ---------- */
.sheet{background:var(--sheet);border:1.5px solid var(--line);border-radius:6px;padding:28px clamp(16px,4vw,40px) 36px}
.sh-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 24px;align-items:flex-end;border-bottom:2px solid var(--ink);padding-bottom:10px}
.sh-top h2{font-family:var(--font-display);font-weight:400;font-size:24px;margin:0;line-height:1.3}
.sh-meta{font-size:12px;color:var(--ink-2);margin:2px 0 0}
.namebox{display:flex;gap:14px;font-size:14px;flex-wrap:wrap}
.namebox span{border-bottom:1px solid var(--ink);padding:0 4px;min-width:2.6em;display:inline-block}
.namebox .nm{min-width:9em}
.sq-list{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column}
.sq{padding:14px 0 16px;border-bottom:1px dashed var(--line);break-inside:avoid;display:flex;flex-direction:column;gap:6px}
.sq-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.sq-h .qno{font-size:16px}
.sq-tag{font-size:11.5px;color:var(--ink-2)}
.sq .qt{font-size:15.5px}
.sq-ch{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 20px;font-family:var(--font-q);font-size:14.5px;margin:0;padding:0;list-style:none}
.aline{align-self:flex-end;display:flex;align-items:flex-end;gap:6px;font-size:14px}
.abox{display:inline-block;min-width:7em;border:1.5px solid var(--ink);border-radius:2px;height:2.1em;padding:2px 8px;font-family:var(--font-q);font-weight:600;font-size:16px;color:var(--pen);text-align:center}
.abox.k{min-width:3em}
.key-ex{font-size:13px;color:var(--pen);line-height:1.8}
.key-ex b{color:var(--pen)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);padding:8px 16px;border-radius:6px;font-size:14px;z-index:20}

@media (max-width:880px){
  .app{grid-template-columns:minmax(0,1fr)}
  .panel{position:static}
}
@media (max-width:560px){
  .choices,.sq-ch{grid-template-columns:minmax(0,1fr)}
  .qt{font-size:16px}
  .card{padding:14px}
}
@media print{
  body{background:#fff;color:#000}
  .mast,.panel,.bar,#solve{display:none!important}
  #sheet,#sheet[hidden]{display:block!important}
  .app{display:block;padding:0}
  .sheet{border:0;padding:0}
}
</style>
</head>
<body>


<div class="app">
  <header class="mast">
    <h1><small>中学校 理科 1〜3年</small>中学理科ドリル工房</h1>
    <p>学年と分野を選ぶと、計算問題と知識問題をその場でつくります。計算問題の数値は毎回変わり、<span class="stats" id="stats"></span>から出題します。</p>
  </header>

  <aside class="panel" aria-label="出題の条件">
    <section class="grp">
      <div class="grp-h"><span class="lbl">出題範囲（学年 × 分野）</span>
        <span class="mini"><button class="link" id="allOn" type="button">すべて</button><button class="link" id="allOff" type="button">クリア</button></span></div>
      <div class="matrix" id="matrix"></div>
      <p class="hint">行・列の見出しを押すと、その学年や分野をまとめて切りかえます。</p>
    </section>
    <section class="grp">
      <span class="lbl">形式</span>
      <div class="seg" data-seg="fmt"><button type="button" data-v="0">ミックス</button><button type="button" data-v="1">計算のみ</button><button type="button" data-v="2">知識のみ</button></div>
    </section>
    <section class="grp">
      <span class="lbl">難易度（計算問題）</span>
      <div class="seg" data-seg="lvl"><button type="button" data-v="1">基本</button><button type="button" data-v="2">標準</button><button type="button" data-v="3">発展</button></div>
    </section>
    <section class="grp">
      <span class="lbl">問題数</span>
      <div class="seg" data-seg="n"><button type="button" data-v="5">5問</button><button type="button" data-v="10">10問</button><button type="button" data-v="15">15問</button><button type="button" data-v="20">20問</button></div>
    </section>
    <button class="btn big" id="gen" type="button">この条件で問題をつくる</button>
    <section class="grp">
      <span class="lbl">セットコード</span>
      <div class="code"><output id="codeOut" aria-label="現在のセットコード"></output><button class="btn ghost sm" id="codeCopy" type="button">コピー</button></div>
      <div class="code"><label class="sr" for="codeIn">セットコードを入力</label><input id="codeIn" placeholder="例：FFF2210-K7Q3XZ" autocomplete="off" spellcheck="false"><button class="btn ghost sm" id="codeLoad" type="button">読み込む</button></div>
      <p class="hint" id="codeMsg">コードを共有すると、同じ問題セットを別の端末で再現できます。</p>
    </section>
  </aside>

  <main>
    <div class="bar">
      <div class="tabs" role="tablist">
        <button role="tab" id="tabSolve" aria-selected="true" aria-controls="solve" type="button">解く</button>
        <button role="tab" id="tabPrint" aria-selected="false" aria-controls="sheet" type="button">プリント</button>
      </div>
      <div class="tools" id="toolsSolve">
        <div class="score" aria-live="polite"><span>正解</span><strong id="scOk">0</strong><span id="scOf">/ 0</span><span class="meter" aria-hidden="true"><i class="m-ok" id="mOk"></i><i class="m-ng" id="mNg"></i></span></div>
        <button class="btn ghost sm" id="retryWrong" type="button">まちがいを解き直す</button>
        <button class="btn ghost sm" id="retryAll" type="button">最初から</button>
      </div>
      <div class="tools" id="toolsPrint" hidden>
        <button class="btn ghost sm" id="keyToggle" type="button" aria-pressed="false">解答を表示</button>
        <button class="btn ghost sm" id="copyText" type="button">テキストでコピー</button>
        <button class="btn sm" id="printBtn" type="button" hidden>印刷する</button>
      </div>
    </div>
    <p class="note" id="note" hidden></p>
    <div class="cards" id="solve" role="tabpanel" aria-labelledby="tabSolve"></div>
    <div id="sheet" role="tabpanel" aria-labelledby="tabPrint" hidden></div>
  </main>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
"use strict";
/* ================= 基本データ ================= */
const FIELDS=[{k:'phys',n:'物理'},{k:'chem',n:'化学'},{k:'bio',n:'生物'},{k:'earth',n:'地学'}];
const FNAME={phys:'物理',chem:'化学',bio:'生物',earth:'地学'};
const UNITS={
  '1phys':'光・音・力','1chem':'身のまわりの物質','1bio':'いろいろな生物','1earth':'大地の成り立ち',
  '2phys':'電流とその利用','2chem':'化学変化と原子・分子','2bio':'生物のからだ','2earth':'気象とその変化',
  '3phys':'運動とエネルギー','3chem':'化学変化とイオン','3bio':'生命の連続性','3earth':'地球と宇宙'};
const UKEYS=Object.keys(UNITS);
const KANA=['ア','イ','ウ','エ'];
const LVN={1:'基本',2:'標準',3:'発展'}, FMTN=['ミックス','計算のみ','知識のみ'];

/* ================= 乱数（シード固定） ================= */
function hashStr(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}return h>>>0}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function makeR(seed){const r=mulberry32(hashStr(seed));return{
  f:r,int:(a,b)=>a+Math.floor(r()*(b-a+1)),pick:a=>a[Math.floor(r()*a.length)],
  shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}}}
const r6=x=>Math.round(x*1e6)/1e6;
const rd=(x,d)=>{const p=10**d;return Math.round(x*p+1e-9)/p};
const fmt=x=>String(r6(+x));
function lv(R,L,arr){const c=arr.filter(a=>a[0]<=L);return R.pick(c.length?c:[arr[0]])[1]()}

/* ================= 計算問題ジェネレーター ================= */
const GENS=[];
const G=(u,name,gen)=>GENS.push({u,name,gen});

/* --- 1年 物理 --- */
G('1phys','ばねののび',(R,L)=>{
  let g0,x0,g1,x1,n=0;
  do{g0=R.pick([10,20,50]);x0=R.pick([0.5,1,1.5,2,2.5,3,4]);g1=R.pick([30,40,60,70,80,90,100,120,150,200]);x1=r6(x0*g1/g0)}
  while((g1===g0||!Number.isInteger(r6(x1*10)))&&++n<80);
  const L0=R.int(5,20);
  return lv(R,L,[
    [1,()=>({q:`ばねに ${g0} g のおもりをつるすと、ばねは ${fmt(x0)} cm のびました。同じばねに ${g1} g のおもりをつるすと、何 cm のびますか。`,ans:x1,unit:'cm',
      ex:`ばねののびはおもりの重さに比例します（フックの法則）。<br>${fmt(x0)} × ${g1} ÷ ${g0} ＝ <b>${fmt(x1)} cm</b>`})],
    [2,()=>({q:`自然の長さが ${L0} cm のばねに ${g0} g のおもりをつるすと、ばねの長さは ${fmt(L0+x0)} cm になりました。${g1} g のおもりをつるすと、ばねの長さは何 cm になりますか。`,ans:r6(L0+x1),unit:'cm',
      ex:`${g0} g でののびは ${fmt(L0+x0)} − ${L0} ＝ ${fmt(x0)} cm。<br>${g1} g でののびは ${fmt(x0)} × ${g1} ÷ ${g0} ＝ ${fmt(x1)} cm。<br>長さ ＝ ${L0} ＋ ${fmt(x1)} ＝ <b>${fmt(L0+x1)} cm</b>`})],
    [3,()=>{const a=Math.min(g0,g1),b=Math.max(g0,g1),La=r6(L0+x0*a/g0),Lb=r6(L0+x0*b/g0);

function satTable(ts){ts=[...new Set(ts)].sort((x,y)=>x-y);return `<table class="dt"><tr><th>気温〔℃〕</th>${ts.map(t=>`<td>${t}</td>`).join('')}</tr><tr><th>飽和水蒸気量〔g/m³〕</th>${ts.map(t=>`<td>${SAT[t]}</td>`).join('')}</tr></table>`}

/* ================= 問題セットの組み立て ================= */
function build(cfg,seed){
  const R=makeR(seed+'/'+encodeCfg(cfg));
  const order=R.shuffle(UKEYS.filter((u,b)=>cfg.mask>>b&1));
  const used=new Set(), gUse={}, items=[];
  for(let i=0,guard=0;items.length<cfg.n&&guard<cfg.n*25;i++,guard++){
    const u=order[i%order.length];
    const want=cfg.fmt===1?'calc':cfg.fmt===2?'choice':(R.f()<0.55?'calc':'choice');
    let it=null;
    if(want==='choice'){
      const pool=BANK.filter(b=>b.u===u&&!used.has(b.q));
      if(pool.length){const b=R.pick(pool);used.add(b.q);const opts=R.shuffle([b.a,...b.w]);
        it={kind:'choice',u,topic:b.t,q:b.q,choices:opts,correct:opts.indexOf(b.a),ex:b.ex}}
      else if(cfg.fmt===2) continue;
    }
    if(!it){
      const gs=GENS.filter(g=>g.u===u);
      const min=Math.min(...gs.map(g=>gUse[g.name]||0));
      const g=R.pick(gs.filter(g=>(gUse[g.name]||0)===min));
      let x=null;
      for(let t=0;t<8;t++){x=g.gen(R,cfg.lvl);if(!used.has(x.q))break}
      if(used.has(x.q)) continue;
      used.add(x.q);gUse[g.name]=(gUse[g.name]||0)+1;
      it=Object.assign({kind:'num',u,topic:g.name},x);
    }
    it._o=items.length;items.push(it);
  }
  items.sort((a,b)=>UKEYS.indexOf(a.u)-UKEYS.indexOf(b.u)||a._o-b._o);
  return items;
}

/* ================= セットコード ================= */
function encodeCfg(c){return c.mask.toString(16).toUpperCase().padStart(3,'0')+c.fmt+c.lvl+String(c.n).padStart(2,'0')}
function parseCode(s){
  const m=String(s).trim().toUpperCase().match(/^([0-9A-F]{3})([0-2])([1-3])(\d{2})-([0-9A-Z]{4,10})$/);
  if(!m)return null;
  const c={mask:parseInt(m[1],16)&0xFFF,fmt:+m[2],lvl:+m[3],n:Math.min(30,Math.max(1,+m[4]))};
  if(!c.mask)return null;
  return{cfg:c,seed:m[5]};
}
function newSeed(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<6;i++)s+=A[Math.floor(Math.random()*A.length)];return s}

/* ================= 条件パネル ================= */
function renderMatrix(){
  const m=state.cfg.mask;let h='<span></span>';
  FIELDS.forEach((f,fi)=>{h+=`<button type="button" class="ch-col f-${f.k}" data-col="${fi}" title="${f.n}をまとめて切りかえ">${f.n}</button>`});
  for(let g=1;g<=3;g++){
    h+=`<button type="button" class="ch-row" data-row="${g}" title="${g}年をまとめて切りかえ">${g}年</button>`;
    FIELDS.forEach((f,fi)=>{const b=(g-1)*4+fi,u=UKEYS[b];
      const nc=GENS.filter(x=>x.u===u).length,nk=BANK.filter(x=>x.u===u).length;
      h+=`<button type="button" class="cell f-${f.k}" data-bit="${b}" aria-pressed="${!!(m>>b&1)}" aria-label="${g}年 ${f.n}「${UNITS[u]}」"><span>${UNITS[u]}</span><b>計${nc}・知${nk}</b></button>`});
  }
  $('#matrix').innerHTML=h;
  $('#gen').disabled=!m;
}
function renderSegs(){
  document.querySelectorAll('.seg').forEach(s=>{const k=s.dataset.seg;
    s.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.v===state.cfg[k])))});
}
$('#matrix').addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;let m=state.cfg.mask;
  if(t.dataset.bit!=null){m^=1<<+t.dataset.bit}
  else{let bits=[];
    if(t.dataset.row){const g=+t.dataset.row;bits=[0,1,2,3].map(i=>(g-1)*4+i)}
    else{const c=+t.dataset.col;bits=[0,1,2].map(g=>g*4+c)}
    const all=bits.every(b=>m>>b&1);bits.forEach(b=>{m=all?m&~(1<<b):m|(1<<b)})}
  state.cfg.mask=m;renderMatrix();
});
$('#allOn').onclick=()=>{state.cfg.mask=0xFFF;renderMatrix()};
$('#allOff').onclick=()=>{state.cfg.mask=0;renderMatrix()};
document.querySelectorAll('.seg').forEach(s=>s.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;state.cfg[s.dataset.seg]=+b.dataset.v;renderSegs()}));
$('#gen').onclick=()=>{if(!state.cfg.mask)return;state.seed=newSeed();regen();
  if(window.matchMedia('(max-width:880px)').matches)$('main').scrollIntoView({behavior:'smooth',block:'start'})};

/* ================= 生成と描画 ================= */
function regen(){
  state.items=build(state.cfg,state.seed);state.res={};
  $('#codeOut').textContent=encodeCfg(state.cfg)+'-'+state.seed;
  const short=state.items.length<state.cfg.n;
  const note=$('#note');note.hidden=!short;
  if(short)note.textContent=`選んだ範囲の知識問題が足りないため、${state.items.length} 問になりました。範囲を広げるか「ミックス」にすると問題数が増えます。`;
  renderSolve();renderSheet();updateScore();save();
}
const wrapT=h=>h.replace(/<table/g,'<div class="tw"><table').replace(/<\/table>/g,'</table></div>');
const ansText=it=>it.kind==='num'?(it.dp!=null?Number(it.ans).toFixed(it.dp):fmt(it.ans))+' '+it.unit:KANA[it.correct]+'　'+it.choices[it.correct];
function head(it,i){const fk=it.u.slice(1);
  return `<span class="qno">問${i+1}</span><span class="tag f-${fk}">${it.u[0]}年・${FNAME[fk]}</span><span class="topic">${it.topic}</span><span class="kind">${it.kind==='num'?'計算':'知識'}</span>`}
function renderSolve(){
  const box=$('#solve');
  if(!state.items.length){box.innerHTML='<div class="empty">出題範囲を1つ以上選んで「この条件で問題をつくる」を押してください。</div>';return}
  box.innerHTML=state.items.map((it,i)=>`<article class="card" id="q${i}">
    <svg class="mark" viewBox="0 0 100 100" aria-hidden="true"></svg>
    <header class="card-h">${head(it,i)}</header>
    <div class="qt">${wrapT(it.q)}</div>
    ${it.kind==='num'
      ?`<div class="ans"><label class="sr" for="in${i}">問${i+1}の答え</label><input id="in${i}" class="num" inputmode="decimal" autocomplete="off" placeholder="数値を入力" data-i="${i}"><span class="unit">${it.unit}</span><button type="button" class="btn sm" data-act="check" data-i="${i}">答え合わせ</button><button type="button" class="link" data-act="reveal" data-i="${i}">答えを見る</button></div>`
      :`<div class="choices">${it.choices.map((c,k)=>`<button type="button" class="ch" data-act="pick" data-i="${i}" data-k="${k}"><span class="kana">${KANA[k]}</span><span>${c}</span></button>`).join('')}</div>`}
    <div class="fb" id="fb${i}" hidden></div>
  </article>`).join('');
}
function parseNum(s){
  s=String(s).replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[．。]/g,'.').replace(/[－−ー]/g,'-').replace(/[,，\s]/g,'');
  const m=s.match(/^-?\d*\.?\d+/);return m?parseFloat(m[0]):NaN}
function isRight(it,x){const tol=it.approx?0.5*10**-(it.dp||0)+1e-9:1e-6*Math.max(1,Math.abs(it.ans));return Math.abs(x-it.ans)<=tol}
const MARK_OK='<path pathLength="1" d="M52 12 C80 11 93 33 89 56 C85 80 61 92 40 88 C18 83 8 61 14 39 C19 22 35 13 58 14"/>';
const MARK_NG='<path pathLength="1" d="M18 46 L40 74 L86 14"/>';
function settle(i,kind){
  const it=state.items[i],card=$('#q'+i),fb=$('#fb'+i);
  state.res[i]=kind;
  card.querySelector('.mark').innerHTML=kind==='ok'?MARK_OK:kind==='ng'?MARK_NG:'';
  card.querySelectorAll('input,.ans button,.ch').forEach(el=>el.disabled=true);
  const v=kind==='ok'?'<p class="verdict ok">正解</p>':kind==='ng'?`<p class="verdict ng">不正解　正しい答えは <b>${ansText(it)}</b></p>`:`<p class="verdict rv">答え　<b>${ansText(it)}</b></p>`;
  fb.innerHTML=v+`<div class="ex">${it.ex}</div>`;fb.hidden=false;
  updateScore();
}
$('#solve').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const i=+b.dataset.i,it=state.items[i];
  if(b.dataset.act==='pick'){const k=+b.dataset.k;
    $('#q'+i).querySelectorAll('.ch').forEach((c,j)=>{if(j===it.correct)c.classList.add('right');else if(j===k)c.classList.add('wrong')});
    settle(i,k===it.correct?'ok':'ng')}
  else if(b.dataset.act==='check'){const inp=$('#in'+i),x=parseNum(inp.value);
    if(isNaN(x)){inp.focus();toast('数値を入力してください');return}
    settle(i,isRight(it,x)?'ok':'ng')}
  else if(b.dataset.act==='reveal'){settle(i,'rv')}
});
$('#solve').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.num')){e.preventDefault();$('#q'+e.target.dataset.i+' [data-act="check"]').click()}});
function updateScore(){
  const n=state.items.length,v=Object.values(state.res),ok=v.filter(x=>x==='ok').length,ng=v.length-ok;
  $('#scOk').textContent=ok;$('#scOf').textContent=`/ ${n}　（回答 ${v.length}）`;
  $('#mOk').style.width=n?ok/n*100+'%':'0';$('#mNg').style.width=n?ng/n*100+'%':'0';
  $('#retryWrong').disabled=!ng;$('#retryAll').disabled=!v.length;
}
function reopen(idx){
  const keep={...state.res};idx.forEach(i=>delete keep[i]);
  const vals={};state.items.forEach((_,i)=>{const el=$('#in'+i);if(el)vals[i]=el.value});
  renderSolve();state.res={};
  Object.entries(keep).forEach(([i,k])=>{const el=$('#in'+i);if(el)el.value=vals[i]||'';
    const it=state.items[i];if(it.kind==='choice'){const cs=$('#q'+i).querySelectorAll('.ch');cs[it.correct].classList.add('right')}
    settle(+i,k)});
  idx.forEach(i=>{const el=$('#in'+i);if(el)el.value=''});
  updateScore();
  const first=idx.length?$('#q'+Math.min(...idx)):null;if(first)first.scrollIntoView({behavior:'smooth',block:'center'});
}
$('#retryWrong').onclick=()=>reopen(Object.keys(state.res).filter(i=>state.res[i]!=='ok').map(Number));
$('#retryAll').onclick=()=>reopen(state.items.map((_,i)=>i));

/* ---------- プリント ---------- */
function rangeLabel(){
  const bits=UKEYS.map((u,b)=>state.cfg.mask>>b&1?u:null).filter(Boolean);
  if(bits.length===12)return '1〜3年 全分野';
  return bits.map(u=>`${u[0]}年${FNAME[u.slice(1)]}`).join('・');
}
function renderSheet(){
  const d=new Date(),date=`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
  const it=state.items;
  $('#sheet').innerHTML=`<div class="sheet">
    <div class="sh-top"><div><h2>理科 演習プリント${state.key?'（解答）':''}</h2>
      <p class="sh-meta">${rangeLabel()}／${FMTN[state.cfg.fmt]}・${LVN[state.cfg.lvl]}／全${it.length}問　${date}　コード ${encodeCfg(state.cfg)}-${state.seed}</p></div>
      <div class="namebox"><span></span>年<span></span>組<span></span>番　名前<span class="nm"></span></div></div>
    <ol class="sq-list">${it.map((q,i)=>`<li class="sq">
      <div class="sq-h">${`<span class="qno">問${i+1}</span>`}<span class="sq-tag">${q.u[0]}年・${FNAME[q.u.slice(1)]}｜${q.topic}</span></div>
      <div class="qt">${wrapT(q.q)}</div>
      ${q.kind==='choice'?`<ul class="sq-ch">${q.choices.map((c,k)=>`<li>${KANA[k]}　${c}</li>`).join('')}</ul>`:''}
      <div class="aline">答え<span class="abox${q.kind==='choice'?' k':''}">${state.key?(q.kind==='num'?(q.dp!=null?Number(q.ans).toFixed(q.dp):fmt(q.ans)):KANA[q.correct]):''}</span>${q.kind==='num'?q.unit:''}</div>
      ${state.key?`<div class="key-ex">${q.ex}</div>`:''}
    </li>`).join('')}</ol></div>`;
}
function sheetText(){
  const strip=h=>{const d=document.createElement('div');d.innerHTML=h.replace(/<br\s*\/?>/g,'\n');
    d.querySelectorAll('table').forEach(t=>{t.replaceWith('\n'+[...t.rows].map(r=>[...r.cells].map(c=>c.textContent.trim()).join(' | ')).join('\n')+'\n')});
    return d.textContent.trim()};
  let s=`理科 演習プリント（${rangeLabel()}／全${state.items.length}問）\nコード ${encodeCfg(state.cfg)}-${state.seed}\n\n`;
  state.items.forEach((q,i)=>{s+=`問${i+1}［${q.u[0]}年${FNAME[q.u.slice(1)]}・${q.topic}］\n${strip(q.q)}\n`;
    if(q.kind==='choice')s+=q.choices.map((c,k)=>`  ${KANA[k]} ${c}`).join('\n')+'\n';
    s+=`答え（　　　　）${q.kind==='num'?q.unit:''}\n\n`});
  s+='――――― 解答・解説 ―――――\n';
  state.items.forEach((q,i)=>{s+=`問${i+1}　${ansText(q)}\n　${strip(q.ex).replace(/\n/g,'\n　')}\n`});
  return s;
}
$('#keyToggle').onclick=()=>{state.key=!state.key;$('#keyToggle').setAttribute('aria-pressed',String(state.key));
  $('#keyToggle').textContent=state.key?'解答をかくす':'解答を表示';renderSheet()};
$('#copyText').onclick=()=>copy(sheetText(),'問題と解答をコピーしました');
$('#codeCopy').onclick=()=>copy($('#codeOut').textContent,'セットコードをコピーしました');
$('#printBtn').onclick=()=>window.print();
try{if(window.self===window.top)$('#printBtn').hidden=false}catch(e){}

function copy(text,msg){
  const fallback=()=>{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
    let ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();toast(ok?msg:'コピーできませんでした。テキストを選択してコピーしてください')};
  try{navigator.clipboard.writeText(text).then(()=>toast(msg),fallback)}catch(e){fallback()}
}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2200)}

$('#codeLoad').onclick=()=>{const p=parseCode($('#codeIn').value);const msg=$('#codeMsg');
  if(!p){msg.textContent='コードの形が正しくありません。「FFF2210-K7Q3XZ」のような形で入力してください。';return}
  state.cfg=p.cfg;state.seed=p.seed;renderMatrix();renderSegs();regen();$('#codeIn').value='';
  msg.textContent='コードの問題セットを読み込みました。';};
$('#codeIn').addEventListener('keydown',e=>{if(e.key==='Enter')$('#codeLoad').click()});

/* ---------- タブ ---------- */
function setTab(t){state.tab=t;const s=t==='solve';
  $('#tabSolve').setAttribute('aria-selected',String(s));$('#tabPrint').setAttribute('aria-selected',String(!s));
  $('#solve').hidden=!s;$('#sheet').hidden=s;$('#toolsSolve').hidden=!s;$('#toolsPrint').hidden=s;save()}
$('#tabSolve').onclick=()=>setTab('solve');$('#tabPrint').onclick=()=>setTab('print');

/* ---------- 起動 ---------- */
$('#stats').textContent=`計算 ${GENS.length} パターン・知識 ${BANK.length} 問`;
const saved=load(),p=saved&&parseCode(saved.code);
if(p){state.cfg=p.cfg;state.seed=p.seed}else state.seed=newSeed();
renderMatrix();renderSegs();regen();
setTab(saved&&saved.tab==='print'?'print':'solve');
})();
</script>

</body>
</html>
